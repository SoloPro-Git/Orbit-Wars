run:
  # stage1 = supervised alignment to REGULAR_CONFIG.
  # selfplay is intentionally not launched by train_stage1_ray; use a dedicated
  # self-play entrypoint after stage1 passes.
  stage: stage1

model:
  d_model: 192
  nhead: 6
  layers: 4
  dropout: 0.10
  max_candidates: 32

proposal:
  # Hybrid policy path: the model proposes full action plans, then the ranker
  # scores them together with regular-rulebase candidates.
  enabled: true
  num_candidates: 8
  send_threshold: 0.45
  max_angle_offset: 0.35
  min_ship_ratio: 0.08
  ship_ratio_choices: [0.35, 0.60, 0.90]
  top_targets_per_source: 2

data:
  num_players: 4
  max_steps: 500
  candidate_width: 32
  include_noop: true
  oracle: rl_informed_regular

training:
  batch_size: 1024
  learning_rate: 0.0002
  weight_decay: 0.0001
  epochs: 10
  updates_per_iteration: 100
  value_loss_weight: 0.5
  entropy_weight: 0.01
  device: cuda
  swanlab_project: orbit-wars
  swanlab_experiment: training2-stage1-regular-refresh-20260518
  swanlab_mode: cloud

ray:
  # Number of Ray trainer actors that consume generated data and run backprop.
  # Stage1 averages trainer shard weights every weight_sync_interval iterations.
  num_trainer_workers: 45

  # Ray GPU resources reserved by each trainer actor.
  # Examples:
  #   1.0 with num_trainer_workers=1 -> one full GPU for training.
  #   1.0 with num_trainer_workers=7 -> seven trainer actors, seven GPUs total.
  #   0.5 with num_trainer_workers=14 -> fourteen trainer actors, seven GPUs total.
  gpus_per_trainer: 0.333
  cpus_per_trainer: 0.5

  # Data workers are CPU Ray actors that generate REGULAR_CONFIG demonstrations.
  # Increase this to generate more training samples in parallel.
  num_data_workers: 64

  # Eval workers run real games for the win-rate gate.
  num_eval_workers: 8

  # Number of full games each data worker generates per training iteration.
  episodes_per_worker: 2

  # Eval actors can use GPU for model inference. 0.25 means four eval workers
  # can share one visible GPU. Set 0.0 when stage1.eval_device is cpu.
  eval_gpus_per_worker: 0.0

  # For offline stage1, each trainer reads only its own byte-range shard from
  # the JSONL dataset. This avoids loading a 10k-game dataset into the driver
  # and broadcasting it to every worker.
  sharded_offline: true

  # Number of local trainer iterations before averaging model weights and
  # redistributing them to every trainer actor.
  weight_sync_interval: 5
  # Empty = start a local Ray runtime. Set to "auto" to connect to an already
  # running Ray cluster. The current multi-node setup starts a GPU head on this
  # host and a CPU rollout worker on txy-h20-2.
  address: 10.0.104.198:6380
  # Optional custom resource name. If set, rollout actors require this resource,
  # which lets you force CPU rollout onto a dedicated Ray worker node.
  rollout_resource: rollout_cpu
  temp_dir: training2/.ray_temp

offline_data:
  # Used by: python -m training2.generate_stage1_dataset_ray
  episodes: 10000
  num_workers: 64
  episodes_per_task: 4
  four_player_prob: 0.3
  # Shuffle supervised candidate order and rewrite target to the oracle's new
  # index. This prevents the ranker from learning the trivial "always index 0"
  # shortcut.
  shuffle_candidates: true
  # Directory output. The generator writes part-00000.jsonl ... part-N.jsonl
  # so trainer workers can read different files directly.
  output_path: data/training2/stage1_regular_current_20260518
  output_shards: 128

# Historical replay disabled for this refresh: keep the teacher signal purely
# from the current REGULAR_CONFIG.
historical_replay:
  # Raw excellent historical games. These JSONL files contain observation +
  # actions, so training2 converts them into shuffled candidate-ranking samples
  # at load time with the historical action as the target.
  enabled: false
  paths:
    - data/online_replay_converted_test
  max_samples:

  # Historical games contain many no-op turns. Keep only this fraction of no-op
  # samples so the action head does not collapse toward always doing nothing.
  keep_noop_prob: 0.2

stage1:
  oracle: rl_informed_regular

  # Empty = start from scratch. Set this to latest.pt or best.pt to continue.
  # CLI --resume still overrides this field.
  resume_from:

  # online: generate fresh regular-rulebase data every iteration.
  # offline: load offline_data_paths plus historical_replay once and train
  # directly from that replay.
  data_source: offline
  offline_data_paths:
    - data/training2/stage1_regular_current_20260518
  offline_max_samples:

  # Single-candidate rows have little ranking signal, but still supervise the
  # proposal head. Keep a small fraction so ranker batches are not dominated by
  # trivial target=0 examples.
  keep_single_candidate_prob: 0.15

  # Training data mix. 1.0 = all 4p games, 0.0 = all 2p games.
  # Example: 0.7 means roughly 70% 4p and 30% 2p.
  data_four_player_prob: 0.3

  # Evaluation mix for the 100-game gate. 0.0 keeps the gate as pure 2p
  # model-vs-regular. Set to 0.5 for mixed 2p/4p gate evaluation.
  eval_four_player_prob: 0.3
  # Stage1 is a rulebase-alignment gate. Keep model-generated proposals out of
  # this win-rate eval until the proposal head has been trained with rollout or
  # negative-candidate supervision.
  eval_use_model_proposals: false

  eval_device: cpu
  max_iterations: 500
  eval_interval: 50
  eval_games: 100
  alignment_eval_samples: 4096
  alignment_eval_interval: 10
  win_rate_threshold: 0.50
  replay_capacity: 200000
  output_dir: training2/checkpoints/stage1_regular_current_20260518

self_play:
  games_per_iteration: 32
  iterations: 1000
  temperature: 0.35
  rulebase_opponent_ratio: 0.50
  checkpoint_opponent_ratio: 0.50
  replay_capacity: 200000

stage15:
  # Advantage training initialized from the completed proposal-safety checkpoint.
  resume_from: training2/checkpoints/stage15_proposal/latest.pt
  output_dir: training2/checkpoints/stage15_advantage
  swanlab_experiment: training2-stage15-advantage
  oracle: rl_informed_regular

  max_iterations: 1000
  # Smoke defaults for advantage training. Scale these back up only after
  # rollout advantage and eval win rate move in the right direction.
  games_per_iteration: 32
  num_rollout_workers: 32
  games_per_rollout_task: 1
  cpus_per_rollout: 1.0
  num_trainer_workers: 45
  cpus_per_trainer: 0.5
  num_eval_workers: 4

  # Rollout workers are environment-bound, so CPU is usually the better default.
  # Trainer actors still use GPU and average weights after every iteration.
  device: cuda
  rollout_device: cpu
  eval_device: cpu
  gpus_per_trainer: 0.333
  gpus_per_rollout: 0.0
  eval_gpus_per_worker: 0.0

  batch_size: 2048
  learning_rate: 0.00005
  updates_per_iteration: 30
  replay_capacity: 200000
  value_loss_weight: 0.5
  entropy_weight: 0.01

  four_player_prob: 0.3
  temperature: 0.4
  epsilon: 0.0
  # Paired baseline advantage mode:
  # for each model game, also run a regular-only game with the same seed/player.
  # Reinforce selected actions only when model_margin - baseline_margin is good;
  # otherwise fall back to the regular rulebase oracle. This avoids teaching the
  # model that every still-losing but improved proposal is bad.
  reward_mode: paired_margin_advantage
  advantage_margin_threshold: 0.0
  advantage_value_scale: 2000.0
  min_policy_weight: 0.25
  max_policy_weight: 2.0
  positive_policy_weight: 1.25
  negative_policy_weight: 1.0

  eval_interval: 20
  eval_games: 100
