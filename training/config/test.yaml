# 测试配置 - 快速验证训练流程

model:
  d_model: 128
  planet_encoder_layers: 3
  fleet_encoder_layers: 2
  fusion_layers: 2
  nhead: 4
  mlp_ratio: 4
  dropout: 0.1
  use_opponent_head: true
  use_autoregressive_refine: false
  activation: "gelu"

training:
  framework: "pytorch"
  tracker: "swanlab"
  swanlab_project: "orbit-wars"
  swanlab_experiment: "ppo-test"
  swanlab_mode: "local"  # 使用本地模式测试
  learning_rate: 3.0e-4
  lr_scheduler: "cosine"
  gamma: 0.99
  gae_lambda: 0.95
  ppo_clip: 0.2
  ppo_epochs: 4
  entropy_coef: 0.01
  value_coef: 0.5
  opponent_pred_coef: 0.1
  intermediate_reward_weight: 0.2
  max_grad_norm: 0.5
  batch_size: 512              # 减小以便快速测试
  num_parallel_games: 16       # 减少以便快速测试
  save_interval: 10            # 更频繁保存
  max_iterations: 20           # 只运行20次迭代
  warmup_steps: 5
  max_checkpoints: 3
  keep_best_n: 1

self_play:
  pool_size: 5                 # 小型对手池
  sample_latest_ratio: 0.4
  sample_random_ratio: 0.3
  sample_best_ratio: 0.2
  sample_heuristic_ratio: 0.1
  two_player_prob: 0.5
  add_to_pool_win_rate: 0.45
  diversity_threshold: 0.3

reward:
  terminal_weight: 1.0
  intermediate_weight: 0.2
  capture_reward_weight: 0.3
  loss_penalty_weight: 0.2
  defense_reward_weight: 0.15
  transit_cost_weight: 0.1
  production_advantage_weight: 0.15
  comet_roi_weight: 0.1

environment:
  episode_steps: 200           # 缩短游戏长度
  act_timeout: 1.0
  ship_speed: 6.0
  sun_radius: 10.0
  board_size: 100.0
  comet_speed: 4.0
