# Orbit Wars RL Training Configuration - 7 GPU 优化配置

model:
  d_model: 128
  planet_encoder_layers: 3
  fleet_encoder_layers: 2
  fusion_layers: 2
  nhead: 4
  mlp_ratio: 4
  dropout: 0.1
  use_opponent_head: true
  use_autoregressive_refine: false
  activation: "gelu"

training:
  framework: "pytorch"
  tracker: "swanlab"
  swanlab_project: "orbit-wars"
  swanlab_experiment: "ppo-self-play"
  swanlab_mode: "disabled"
  learning_rate: 3.0e-4
  lr_scheduler: "cosine"
  gamma: 0.99
  gae_lambda: 0.95
  ppo_clip: 0.2
  ppo_epochs: 4
  entropy_coef: 0.01
  value_coef: 0.5
  opponent_pred_coef: 0.1
  intermediate_reward_weight: 0.2
  max_grad_norm: 0.5
  batch_size: 16384        # 适中的batch size
  num_parallel_games: 1792 # 28 workers × 64 游戏
  num_feature_workers: 16
  enable_rollout_timing: false
  use_gpu_features: false
  save_interval: 50
  max_iterations: 10000
  warmup_steps: 100
  max_checkpoints: 5
  keep_best_n: 2
  resume_from_checkpoint: true

self_play:
  pool_size: 20
  sample_latest_ratio: 0.4
  sample_random_ratio: 0.3
  sample_best_ratio: 0.2
  sample_heuristic_ratio: 0.1
  two_player_prob: 0.3
  add_to_pool_win_rate: 0.45
  diversity_threshold: 0.3

reward:
  terminal_weight: 1.0
  intermediate_weight: 0.2
  capture_reward_weight: 0.3
  loss_penalty_weight: 0.2
  defense_reward_weight: 0.15
  transit_cost_weight: 0.1
  production_advantage_weight: 0.15
  comet_roi_weight: 0.1

environment:
  episode_steps: 500
  act_timeout: 1.0
  ship_speed: 6.0
  sun_radius: 10.0
  board_size: 100.0
  comet_speed: 4.0

# Ray 分布式训练配置 - 7 GPU 优化
ray:
  num_rollout_workers: 14      # 7卡 × 2 workers = 14
  num_gpus_per_worker: 0.5    # 每个 worker 1/2 GPU
  trainer_num_gpus: 0.5       # Trainer 用 1/2 GPU
  games_per_rollout: 4        # 每次 rollout 4 游戏
  max_rollout_retries: 3
