# Orbit Wars 训练配置示例 - 启用专家数据预训练

model:
  d_model: 128
  planet_encoder_layers: 3
  fleet_encoder_layers: 2
  fusion_layers: 2
  nhead: 4
  mlp_ratio: 4
  dropout: 0.1
  use_opponent_head: true
  use_autoregressive_refine: false
  activation: gelu

training:
  framework: pytorch
  tracker: swanlab
  swanlab_project: orbit-wars
  swanlab_experiment: ppo-with-expert-pretraining
  swanlab_mode: cloud
  learning_rate: 3e-4
  lr_scheduler: cosine
  gamma: 0.99
  gae_lambda: 0.95
  ppo_clip: 0.2
  ppo_epochs: 4
  entropy_coef: 0.01
  value_coef: 0.5
  opponent_pred_coef: 0.1
  intermediate_reward_weight: 0.2
  max_grad_norm: 0.5
  batch_size: 2048
  num_parallel_games: 128
  num_feature_workers: 8
  enable_rollout_timing: false
  use_gpu_features: false
  save_interval: 50
  max_iterations: 10000
  warmup_steps: 100
  max_checkpoints: 5
  keep_best_n: 2
  resume_from_checkpoint: true
  output_dir: checkpoints

self_play:
  pool_size: 20
  sample_latest_ratio: 0.4
  sample_random_ratio: 0.3
  sample_best_ratio: 0.2
  sample_heuristic_ratio: 0.1
  two_player_prob: 0.3
  add_to_pool_win_rate: 0.45
  diversity_threshold: 0.3

reward:
  terminal_weight: 1.0
  intermediate_weight: 0.2
  capture_reward_weight: 0.3
  loss_penalty_weight: 0.2
  defense_reward_weight: 0.15
  transit_cost_weight: 0.1
  production_advantage_weight: 0.15
  comet_roi_weight: 0.1

environment:
  episode_steps: 500
  act_timeout: 1.0
  ship_speed: 6.0
  sun_radius: 10.0
  board_size: 100.0
  comet_speed: 4.0

ray:
  num_rollout_workers: 8
  num_gpus_per_worker: 0.25
  trainer_num_gpus: 1
  games_per_rollout: 64
  max_rollout_retries: 3

# 专家数据预训练配置
expert_data:
  enabled: true                        # 启用专家数据预训练
  data_dir: data/expert_demonstrations  # 专家数据目录
  num_pretrain_iterations: 100         # 预训练迭代次数
  pretrain_batch_size: 256             # 预训练批次大小
  pretrain_learning_rate: 1e-4         # 预训练学习率
  behavior_clone_loss_coef: 1.0        # 行为克隆损失系数
  mix_expert_data_ratio: 0.3           # 在 RL 训练中混合专家数据的比例
  use_until_iteration: 100             # 前 N 次迭代使用专家数据（-1 表示一直使用）
