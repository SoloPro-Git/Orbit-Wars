# Orbit Wars 训练配置（默认配置）

# ===========================================================================
# 模型配置
# ===========================================================================
model:
  d_model: 128
  planet_encoder_layers: 3
  fleet_encoder_layers: 2
  fusion_layers: 2
  nhead: 4
  mlp_ratio: 4
  dropout: 0.1
  use_opponent_head: true
  use_autoregressive_refine: false
  activation: gelu

# ===========================================================================
# 训练配置
# ===========================================================================
training:
  framework: pytorch
  tracker: swanlab
  swanlab_project: orbit-wars
  swanlab_experiment: orbit-wars-training
  swanlab_mode: cloud
  learning_rate: 3e-4
  lr_scheduler: cosine
  gamma: 0.99
  gae_lambda: 0.95
  ppo_clip: 0.2
  ppo_epochs: 4
  entropy_coef: 0.01
  value_coef: 0.5
  opponent_pred_coef: 0.1
  intermediate_reward_weight: 0.2
  max_grad_norm: 0.5
  batch_size: 2048
  num_parallel_games: 128
  num_feature_workers: 8
  enable_rollout_timing: false
  use_gpu_features: false
  save_interval: 50
  max_iterations: 10000
  warmup_steps: 100
  max_checkpoints: 5
  keep_best_n: 2
  resume_from_checkpoint: true
  output_dir: checkpoints

# ===========================================================================
# 自我对战配置
# ===========================================================================
self_play:
  pool_size: 64
  sample_expert_ratio: 0.1       # training/expert 中的 KaggleExpert
  sample_heuristic_ratio: 0.1    # debug_eval 中的 nearest_planet（兼容旧字段名）
  sample_checkpoint_ratio: 0.8   # 历史 checkpoint
  checkpoint_latest_ratio: 0.3   # checkpoint 内: 最新版本
  checkpoint_best_ratio: 0.3     # checkpoint 内: 最高 Elo
  checkpoint_random_ratio: 0.4   # checkpoint 内: 随机历史版本
  two_player_prob: 0.3
  add_to_pool_win_rate: 0.45
  diversity_threshold: 0.3

# ===========================================================================
# 奖励函数配置
# ===========================================================================
reward:
  terminal_weight: 1.0
  intermediate_weight: 0.2
  capture_reward_weight: 0.3
  loss_penalty_weight: 0.2
  defense_reward_weight: 0.15
  transit_cost_weight: 0.1
  production_advantage_weight: 0.15
  comet_roi_weight: 0.1

# ===========================================================================
# 环境配置
# ===========================================================================
environment:
  episode_steps: 500
  act_timeout: 1.0
  ship_speed: 6.0
  sun_radius: 10.0
  board_size: 100.0
  comet_speed: 4.0

# ===========================================================================
# Ray 分布式训练配置
# ===========================================================================
ray:
  num_rollout_workers: 24
  num_gpus_per_worker: 0.25
  trainer_num_gpus: 0.5
  games_per_rollout: 64
  max_rollout_retries: 3

# ===========================================================================
# 专家数据预训练配置
# ===========================================================================
expert_data:
  # 启用专家数据预训练
  enabled: true

  # 数据目录
  data_dir: data/expert_demonstrations

  # 训练配置
  num_pretrain_iterations: 3000         # 最大预训练迭代次数
  pretrain_batch_size: 256             # 预训练批次大小
  pretrain_learning_rate: 1e-4         # 预训练学习率
  behavior_clone_loss_coef: 1.0        # 行为克隆损失系数

  # Ray 分布式预训练配置
  num_pretrain_workers: 28              # Ray Worker 数量
  gpus_per_worker: 0.25                 # 每个 Worker GPU 数量
  sync_interval: 10                     # 每隔多少个 iter 合并一次参数

  # 自动化配置
  auto_proceed: true                   # 评估未达标自动继续（不中断）
  pretrain_resume_from: null
  mix_expert_data_ratio: 0.3           # RL 阶段混合专家数据比例
  use_until_iteration: 0             # 前 N 次迭代使用专家数据

  # 专家策略评估门控
  eval_gate_enabled: true              # 启用真实对局评估门控
  eval_gate_interval: 100              # 每 N iteration 评估一次
  eval_gate_num_games: 20              # 每次评估的对局数
  eval_gate_win_rate_threshold: 0.45   # 胜率阈值（>= 此值通过门控）
  eval_gate_device: cpu                # 评估设备（CPU 不干扰 GPU 训练）
